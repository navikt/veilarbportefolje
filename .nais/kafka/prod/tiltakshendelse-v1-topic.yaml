apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: tiltakshendelse-v1
  namespace: obo
  labels:
    team: obo
spec:
  pool: nav-prod
  config:
    cleanupPolicy: delete # delete = Ingen compaction
    retentionHours: -1 # til enden av universet
    retentionBytes: -1
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 2
  acl:
    - team: obo
      application: veilarbportefolje
      access: read
    - team: pto
      application: pto-kafka-manager
      access: read
    - team: obo
      application: obo-kafka-manager
      access: read
    - team: amt
      application: amt-distribusjon
      access: write
